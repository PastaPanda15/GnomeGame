<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beta 1.0</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14284d;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 4px black;
        }

        #title {
            position: fixed;
            left: 20px;
            top: 20px;
            color: white;
            font-family: Arial;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px black;
            pointer-events: none;
        }

        #gold {
            position: fixed;
            right: 20px;
            top: 20px;
            color: gold;
            font-family: Arial;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 5px black;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
    
    <script src="./photon/lib/photon.js"></script>
    
    <script type="module" src="./main.js"></script>
</head>

<body>

<div id="title">Beta 1.0</div>
<div id="crosshair">+</div>
<div id="gold">Gold: 0</div>

</body>
</html>
